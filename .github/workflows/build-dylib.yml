name: Build iOS GeoSimHook.dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install ldid (optional ad-hoc signer)
        run: brew install ldid || true

      - name: Compile GeoSimHook.dylib (arm64)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload GeoSimHook.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoSimHook-dylib
          path: build/GeoSimHook.dylib
          if-no-files-found: error
